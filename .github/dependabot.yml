version: 2
updates:
  - package-ecosystem: 'gradle'
    directories:
      - 'pdc-keycloak-theme'
      - 'twilio-keycloak-provider'
      - 'keycloak-required-action'
    schedule:
      interval: 'daily'
    groups:
      junit-and-mockito:
        patterns:
          - 'org.junit.*'
          - 'org.mockito:*'
      keycloak:
        patterns:
          - 'org.keycloak:*'
  - package-ecosystem: 'github-actions'
    directory: '.github/workflows'
    schedule:
      interval: 'daily'
    groups:
      github-actions:
        patterns:
          - '*'
