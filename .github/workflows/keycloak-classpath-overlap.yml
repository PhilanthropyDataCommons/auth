name: Keycloak classpath overlap

# Two verification tasks defined inline in
# twilio-keycloak-provider/build.gradle.kts, both reading the shadowJar
# task's live dependencyFilter and relocators:
#   checkKeycloakClasspathOverlap (pre-shade) FAILs on an overlapping twilio
#     jar not excluded by exclude(dependency(...));
#   checkKeycloakShading (post-shade) builds the shadowJar and FAILs on any
#     shipped .class that is not excluded, relocated, or the provider's own.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  keycloak-classpath-overlap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code.
        uses: actions/checkout@v7
      - name: Get Zulu OpenJDK (current LTS version).
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '25'
          cache: 'gradle'
      - name: Cache the downloaded/unpacked Keycloak distribution.
        # Keyed on build.gradle.kts so a keycloak version bump invalidates it.
        uses: actions/cache@v4
        with:
          path: twilio-keycloak-provider/build/keycloak-overlap-dist
          key: keycloak-overlap-dist-${{ runner.os }}-${{ hashFiles('twilio-keycloak-provider/build.gradle.kts') }}
          restore-keys: |
            keycloak-overlap-dist-${{ runner.os }}-
      - name: Check for pre-shade class overlap with the Keycloak runtime classpath.
        working-directory: twilio-keycloak-provider
        run: ../gradlew checkKeycloakClasspathOverlap --stacktrace
      - name: Check for post-shade leftover/un-relocated classes.
        working-directory: twilio-keycloak-provider
        run: ../gradlew checkKeycloakShading --stacktrace
