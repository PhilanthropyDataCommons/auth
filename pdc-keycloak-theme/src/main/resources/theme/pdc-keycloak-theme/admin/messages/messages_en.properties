# Validation messages for the link-to-welcome-page required action, translated
# by the admin theme's message bundle. Author: GLM-5.2
#
# Placeholders use {{n}} (i18next, not MessageFormat) and {{0}} is the field
# name, not the first parameter: Keycloak prepends the ValidationError's
# inputHint at index 0, so the message parameters start at {{1}} ({{2}} for the
# second). Keycloak's own keys follow this, e.g.
# error-invalid-length=Attribute {0} must have a length between {1} and {2}.

link-to-welcome-page.error-target-client-required = A target client is required when any link-to-welcome-page configuration is present.
link-to-welcome-page.error-client-not-found = Client "{{1}}" does not exist.
link-to-welcome-page.error-invalid-redirect-uri = "{{1}}" is not a registered valid redirect URI for client "{{2}}".
