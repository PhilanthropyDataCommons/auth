# Friendly, admin-console-localized validation messages for the
# link-to-welcome-page required action (see the link-to-welcome-page module).
# Keycloak renders a ValidationError's message field as a message key looked
# up in the admin theme's message bundle (ValidationError: "Holds the message
# key for translation"); without these overrides the admin console would show
# the literal key. Keys are namespaced under "link-to-welcome-page." and use
# kebab-case to match Keycloak's own admin keys (error-invalid-value,
# error-invalid-uri, ...).
#
# Placeholder syntax and indexing (important):
#  - Use the DOUBLE-brace {{n}} syntax, NOT java.text.MessageFormat
#    single-brace {n}: the v2 admin UI (RequiredActionConfigModal ->
#    setUserProfileServerError -> i18next t()) does the interpolation, and
#    i18next uses {{...}}. Keycloak's own v2 admin keys follow the same
#    convention (e.g. error-invalid-value='{{0}}' has invalid value.).
#  - {{0}} is NOT the first message parameter. Keycloak prepends the
#    ValidationError's inputHint (the field/config key name, e.g.
#    "targetClient") at index 0: ValidationException.Error.
#    getMessageParameters() returns ValidationError.
#    getInputHintWithMessageParameters(), whose args[0] = inputHint and
#    args[1..] = the messageParameters passed to the ValidationError
#    constructor. So {{0}} = the field name and {{1}}, {{2}}, ... = the real
#    parameters (the values the admin entered). Keycloak's own base/admin
#    keys follow this (error-invalid-length=Attribute {0} must have a length
#    between {1} and {2}.). Our messages therefore start at {{1}}.
# Author: GLM-5.2

link-to-welcome-page.error-target-client-required = A target client is required when any link-to-welcome-page configuration is present.
link-to-welcome-page.error-client-not-found = Client "{{1}}" does not exist.
link-to-welcome-page.error-invalid-redirect-uri = "{{1}}" is not a registered valid redirect URI for client "{{2}}".
